[project]
name = "knack-elt"
version = "0.4.0"
description = "Generic ELT pipeline: extract any Knack application into DuckDB or MotherDuck with dlt, keeping full SCD2 history."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["knack", "elt", "dlt", "duckdb", "motherduck", "data-pipeline", "scd2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dlt[duckdb]>=1.30.0",
    "httpx[http2]>=0.28.1",
    "knack-sleuth>=0.7.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]


[project.urls]
Homepage = "https://github.com/mcmasty/knack-elt"
Repository = "https://github.com/mcmasty/knack-elt"
Issues = "https://github.com/mcmasty/knack-elt/issues"

[project.scripts]
knack-elt = "knack_elt.cli:cli"

[build-system]
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set widens between releases, and CI
# should fail on our choices rather than on ruff's changing defaults.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length - not enforced, comments here carry reasoning
]

[tool.ruff.lint.per-file-ignores]
# Typer's API *is* function calls in argument defaults.
"src/knack_elt/cli.py" = ["B008"]

[tool.bumpversion]
current_version = "0.4.0"
commit = true
tag = true
allow_dirty = false
# uv.lock records this package's own version, and CI runs `uv sync --locked`, so a
# bump that leaves the lock behind fails the release at its first step. Regenerate
# and stage it inside the bump commit rather than patching it afterwards. Not a
# [[tool.bumpversion.files]] entry: a bare `version = "x.y.z"` search would also
# match any dependency that happens to share the version number.
allow_shell_hooks = true
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/knack_elt/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'


[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
